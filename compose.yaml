# One test instance. bin/up starts every instance as its own Compose project
# (wp-test-env-<instance>) with the variables from state/<instance>/compose.env;
# compose.dev.yaml adds the workspace for instances in dev mode. Nothing is
# persisted: database, WordPress core and uploads live on tmpfs.
services:
  db:
    image: mariadb:lts
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 30s

  mail:
    image: axllent/mailpit:latest

  # Persistent object cache (profile objectcache) for WP_OBJECT_CACHE=valkey; one per
  # instance, because the drop-in's flush empties the whole Valkey database.
  valkey:
    image: valkey/valkey:9.1-alpine
    profiles: [objectcache]
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 30

  wordpress:
    image: wp-test-env-wordpress
    pull_policy: never
    # bin/wp, bin/exec and bin/logs address the instance by this name.
    container_name: wp-test-env-${WP_TEST_INSTANCE:?}
    depends_on:
      db:
        condition: service_healthy
      # Only with the profile objectcache (bin/up --object-cache valkey).
      valkey:
        condition: service_healthy
        required: false
    # Loopback requests (WP-Cron, Site Health) to the site URL stay inside the container.
    extra_hosts:
      - "${WP_TEST_HOST:?}:127.0.0.1"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://${WP_TEST_HOST:?}');
        define('WP_SITEURL', 'http://${WP_TEST_HOST:?}');
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', '/dev/stderr');
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('WP_REDIS_HOST', 'valkey');
      XDEBUG_MODE: ${XDEBUG_MODE:?}
      # Persistent object cache: empty (none) or valkey (drop-in installed by the entrypoint).
      WP_OBJECT_CACHE: ${WP_OBJECT_CACHE?}
      WP_REDIS_HOST: valkey
      # Projects in the workspace that the entrypoint links into wp-content (dev mode only).
      WP_THEMES: ${WP_THEMES?}
      WP_PLUGINS: ${WP_PLUGINS?}
    # Further variables of the instance (bin/up --env), e.g. XDEBUG_CONFIG.
    env_file: ${WP_TEST_STATE:?}/wordpress.env
    # The image declares VOLUME /var/www/html; a tmpfs forces a fresh core from the image on every start.
    tmpfs:
      - /var/www/html:mode=0755
    volumes:
      # Release ZIPs to install (bin/up copies them here).
      - ${WP_TEST_STATE:?}/release:/release:ro
    networks:
      default: {}
      # The only service on the shared network: test runners reach the instance at
      # http://<instance>.test. Never address it by the service name there (every instance has one).
      shared:
        aliases:
          - ${WP_TEST_HOST:?}

networks:
  shared:
    external: true
    name: wp-test-env
