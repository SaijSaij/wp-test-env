# No persistent connections. Test clients reuse an idle connection the moment Apache
# closes it after KeepAliveTimeout: Node's http.Agent (Playwright's APIRequestContext,
# keepAlive: true) drops an idle socket at the Keep-Alive timeout Apache announces,
# which is exactly when Apache closes it, so a request after about 5 s of rest failed
# now and then with ECONNRESET ("socket hang up"). Apache sets the Keep-Alive header
# itself after mod_headers, so a shorter announced timeout is not possible. A new
# connection per request costs nothing measurable on the Docker network.
KeepAlive Off
